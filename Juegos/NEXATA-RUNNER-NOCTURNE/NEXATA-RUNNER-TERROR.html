<script>
/* =========================================================
   NEXATA RUNNER - SISTEMA DE AUDIO
   Música y efectos desde /audio/
========================================================= */
(function () {
  const base = new URL("audio/", document.baseURI).href;

  const audio = {
    musica: new Audio(base + "musica-terror-ambiental-1.mp3"),
    salto: new Audio(base + "salto.mp3"),
    doble: new Audio(base + "doble-salto.mp3"),
    muerte: new Audio(base + "muerte.mp3"),
    jumpscare: new Audio(base + "jumpscare.mp3")
  };

  audio.musica.loop = true;
  audio.musica.volume = 0.35;
  audio.salto.volume = 1.0;
  audio.doble.volume = 1.0;
  audio.muerte.volume = 1.0;
  audio.jumpscare.volume = 1.0;

  Object.keys(audio).forEach(function(nombre){
    audio[nombre].preload = "auto";
    audio[nombre].load();
    audio[nombre].addEventListener("error", function(){
      console.error("NEXATA AUDIO: no se pudo cargar " + nombre + ":", audio[nombre].src);
    });
  });

  let desbloqueado = false;

  function desbloquearAudio(){
    if (desbloqueado) return;
    desbloqueado = true;
    console.log("NEXATA AUDIO: audio desbloqueado");
  }

  function reproducir(nombre){
    if (!window.NEXATA_AUDIO.enabled || !audio[nombre]) return;
    try {
      const sonido = audio[nombre];
      sonido.pause();
      sonido.currentTime = 0;
      const promesa = sonido.play();
      if (promesa) {
        promesa.catch(function(error){
          console.warn("NEXATA AUDIO: no se pudo reproducir " + nombre, error);
        });
      }
    } catch(error) {
      console.error("NEXATA AUDIO:", error);
    }
  }

  function iniciarMusica(){
    if (!window.NEXATA_AUDIO.enabled) return;
    try {
      if (audio.musica.paused) {
        const promesa = audio.musica.play();
        if (promesa) promesa.catch(function(error){
          console.warn("NEXATA AUDIO: música bloqueada hasta interacción del usuario", error);
        });
      }
    } catch(error) {
      console.error("NEXATA AUDIO: error música:", error);
    }
  }

  function detenerMusica(){
    audio.musica.pause();
    audio.musica.currentTime = 0;
  }

  window.NEXATA_AUDIO = {
    enabled: true,
    desbloquear: desbloquearAudio,
    startMusic: iniciarMusica,
    stopMusic: detenerMusica,
    play: reproducir,
    toggle: function(){
      this.enabled = !this.enabled;
      if (this.enabled) iniciarMusica();
      else detenerMusica();
      return this.enabled;
    }
  };

  ["pointerdown", "keydown", "touchstart"].forEach(function(evento){
    document.addEventListener(evento, function(){
      desbloquearAudio();
      if (window.NEXATA_AUDIO.enabled && audio.musica.paused) iniciarMusica();
    }, { once:true, passive:evento !== "keydown" });
  });

  console.log("NEXATA AUDIO: sistema iniciado");
  console.log("NEXATA AUDIO: carpeta", base);
})();
</script>

<button id="nexata-audio-btn" type="button">🔊 AUDIO</button>
<script>
(function(){
  const b=document.getElementById("nexata-audio-btn");
  if(!b) return;
  b.addEventListener("click",function(){
    window.NEXATA_AUDIO.desbloquear();
    const on=window.NEXATA_AUDIO.toggle();
    b.textContent=on?"🔊 AUDIO":"🔇 AUDIO";
  });
})();
</script>

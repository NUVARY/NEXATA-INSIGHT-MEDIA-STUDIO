<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Header Global NEXATA</title>
</head>
<body>

<!-- HEADER ESCRITORIO -->
<header class="header-escritorio">

    <div class="header-izquierda">
        <img src="/IMAGENES/Logotipo/nexata_insight_media_studio_lockup.webp"
             class="logo-nexata escritorio"
             alt="Logo Nexata">
    </div>

    <div class="header-centro">
        <a href="/informacion.html" class="logo escritorio btn-info">
            Más Información
        </a>
    </div>

    <nav class="menu-escritorio">
        <a href="/index.html" class="btn-feed">Feed</a>
        <a href="/categorias.html" class="btn-categorias">Categorías</a>
        <a href="/perfil.html" class="btn-perfil">Perfil</a>
    </nav>

</header>

<header class="header-extra-escritorio"></header>

<!-- HEADER MÓVIL -->
<header class="header-movil">

    <img src="/IMAGENES/Logotipo/enso_play_logo.webp"
         class="logo-nexata movil"
         alt="Logo Nexata">

    <div class="logo-movil">
        NEXATA INSIGHT MEDIA STUDIO
    </div>

    <nav class="menu-movil">
        <a href="/index.html" class="btn-feed">Feed</a>
        <a href="/categorias.html" class="btn-categorias">Categorías</a>
        <a href="/perfil.html" class="btn-perfil">Perfil</a>
    </nav>

</header>

<header class="header-extra-movil"></header>

<!--
Ejemplos para ocultar botones según la página:

.btn-feed { display:none; }
.btn-categorias { display:none; }
.btn-info { display:none; }
.btn-perfil { display:none; }
-->

</body>
</html>

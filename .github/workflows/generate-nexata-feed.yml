
name: Generar RSS de NEXATA

on:
  push:
    paths:
      - "BLOGS/**/*.html"
      - "BLOGS/*.html"
      - "scripts/generate_feed.py"
      - ".github/workflows/generate-nexata-feed.yml"

  workflow_dispatch:

  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

concurrency:
  group: nexata-rss
  cancel-in-progress: false

jobs:
  generar-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generar RSS automáticamente
        run: python scripts/generate_feed.py

      - name: Guardar RSS actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed.xml

          if git diff --cached --quiet; then
            echo "El RSS ya está actualizado."
          else
            git commit -m "Actualizar RSS automáticamente"
            git push
          fi

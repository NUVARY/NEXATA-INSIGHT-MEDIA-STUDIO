name: Notificar nueva publicación

on:
  push:
    branches:
      - "NUVARY-(B)"
    paths:
      - "BLOGS/**"

jobs:
  enviar-notificacion:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Firebase Admin
        run: npm install firebase-admin

      - name: Obtener suscriptores y enviar correos
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cat > enviar.js <<'EOF'
          const admin = require("firebase-admin");

          const serviceAccount =
            JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);

          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount)
          });

          const db = admin.firestore();

          async function enviar() {
            const snapshot =
              await db.collection("suscriptores").get();

            if (snapshot.empty) {
              console.log("No hay suscriptores.");
              return;
            }

            const correos = [];

            snapshot.forEach(doc => {
              const datos = doc.data();

              if (datos.correo) {
                correos.push(datos.correo);
              }
            });

            console.log(`Suscriptores encontrados: ${correos.length}`);

            for (const correo of correos) {
              const respuesta = await fetch(
                "https://api.resend.com/emails",
                {
                  method: "POST",
                  headers: {
                    "Authorization":
                      `Bearer ${process.env.RESEND_API_KEY}`,
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    from:
                      "NEXATA INSIGHT MEDIA STUDIO <avisos@nexata.site>",
                    to: [correo],
                    subject:
                      "🔔 Nueva publicación en NEXATA",
                    html:
                      "<h2>🔔 Hay una nueva publicación</h2>" +
                      "<p>Ya puedes visitar NEXATA INSIGHT MEDIA STUDIO " +
                      "para descubrir el nuevo contenido.</p>" +
                      "<p><a href='https://nexata.site'>" +
                      "Visitar NEXATA</a></p>"
                  })
                }
              );

              const resultado = await respuesta.text();

              console.log(
                `Correo enviado a ${correo}: ${resultado}`
              );
            }
          }

          enviar().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

          node enviar.js
